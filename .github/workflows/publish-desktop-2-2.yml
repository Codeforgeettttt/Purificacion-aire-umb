name: Publish verified desktop v2.2.0
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-desktop-2-2.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish the verified Windows binaries
        shell: bash
        run: |
          set -euo pipefail
          run=44795230601
          source=728f0af4c7a78512dbef81cef55413523fb2ca57
          test "$(gh run view "$run" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$run" --json headSha --jq .headSha)" = "$source"
          git merge-base --is-ancestor "$source" HEAD
          gh run download "$run" -n air-quality-windows-x64 -D windows
          setup=windows/AirQualityIntelligence-Setup-2.2.0.exe
          portable=windows/AirQualityIntelligence-Portable-2.2.0.exe
          test -s "$setup"
          test -s "$portable"
          if gh release view v2.2.0 --json tagName >/dev/null 2>&1; then
            echo 'v2.2.0 already exists'
          else
            gh release create v2.2.0 "$setup" "$portable" --target "$source" --title "Air Quality Intelligence Desktop v2.2.0" --latest --notes "Distribución para Windows x64 con instalador NSIS y edición portátil. Incluye simulación offline, dashboard, reportes PDF/CSV y respaldos SQLite. Ejecutables sin firma digital. Instalación, inicio y desinstalación verificados en GitHub Actions."
          fi
          gh release view v2.2.0 --json assets --jq '.assets[].name' > assets.txt
          grep -Fx "$(basename "$setup")" assets.txt
          grep -Fx "$(basename "$portable")" assets.txt
      - name: Remove only the two merged branches
        shell: bash
        run: |
          set -euo pipefail
          while read -r branch expected; do
            git merge-base --is-ancestor "$expected" HEAD
            current="$(gh api "repos/$GH_REPO/git/matching-refs/heads/$branch" --jq ".[] | select(.ref == \"refs/heads/$branch\") | .object.sha")"
            if [[ -z "$current" ]]; then
              continue
            fi
            test "$current" = "$expected"
            gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch"
          done <<'BRANCHES'
          feat/air-quality-intelligence 5fcc0839a24a12795c85c0375ff3eb78158e2926
          feat/desktop-electron 728f0af4c7a78512dbef81cef55413523fb2ca57
          BRANCHES
