name: Windows desktop
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run package:win
      - run: node scripts/desktop-smoke.js release/win-unpacked/AirQualityIntelligence.exe
      - uses: actions/upload-artifact@v6
        with:
          name: air-quality-windows-x64
          path: release/*.exe
          if-no-files-found: error
